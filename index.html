<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d0f" />
  <title>Cellbound — Coming Soon</title>
  <meta name="description" content="Cellbound is being prepared for its next expedition." />
  <link rel="stylesheet" href="./styles.css?v=2" />
  <style>
    .coming-soon-shell{
      min-height:100vh;
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
      background:#090d0f;
      color:#f4efe3;
      text-align:center;
      padding:24px;
    }
    .coming-soon-world{
      position:absolute;
      inset:0;
      z-index:0;
    }
    .coming-soon-world img{
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:.34;
      filter:saturate(.75) contrast(1.08);
    }
    .coming-soon-world::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 40%, rgba(42,76,76,.12), transparent 36%),
        linear-gradient(180deg, rgba(9,13,15,.35), rgba(9,13,15,.92));
    }
    .coming-soon-card{
      position:relative;
      z-index:1;
      width:min(680px,100%);
      padding:48px 32px;
      border:1px solid rgba(220,196,139,.28);
      background:rgba(8,12,14,.82);
      box-shadow:0 24px 80px rgba(0,0,0,.45);
      backdrop-filter:blur(8px);
    }
    .coming-soon-kicker{
      margin:0 0 12px;
      letter-spacing:.24em;
      font-size:.78rem;
      font-weight:800;
      color:#cbb786;
    }
    .coming-soon-card h1{
      margin:0;
      font-size:clamp(3rem,10vw,6rem);
      line-height:.9;
      letter-spacing:-.04em;
      text-transform:uppercase;
    }
    .coming-soon-card p{
      margin:22px auto 0;
      max-width:520px;
      color:#c7c3b8;
      font-size:1.05rem;
      line-height:1.7;
    }
    .coming-soon-divider{
      width:84px;
      height:1px;
      margin:28px auto;
      background:rgba(220,196,139,.5);
    }
    .coming-soon-note{
      margin:0 !important;
      font-size:.82rem !important;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#8f958f !important;
    }
  </style>
</head>
<body>
  <main class="coming-soon-shell">
    <div class="coming-soon-world" aria-hidden="true">
      <img src="./assets/comics/tutorial/wardens_at_the_twilight_city_gate.webp" alt="" />
    </div>

    <section class="coming-soon-card" aria-label="Cellbound coming soon">
      <p class="coming-soon-kicker">CELLBOUND</p>
      <h1>Coming Soon</h1>
      <div class="coming-soon-divider" aria-hidden="true"></div>
      <p>The gates of Zeltira are being prepared. Cellbound is currently in development and will open to new guildmasters soon.</p>
      <p class="coming-soon-note">Development build</p>
    </section>
  </main>
</body>
</html>
