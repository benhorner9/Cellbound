name: Deploy Cellbound Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellbound-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Promote approved build to playcellbound.com
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out approved Cellbound build
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build public Cellbound website
        run: npm run build:site

      - name: Verify deployment package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist-site/index.html
          test -f dist-site/website-v1.css
          test -f dist-site/assets/dungeons/ashen-vault.webp
          test -f dist-site/assets/manor/manor-raid-hero.webp
          ! test -f dist-site/guild.html
          ! test -f dist-site/auth.js
          ! grep -R --line-number -E 'guild\.html|auth\.js|supabase' dist-site/index.html

      - name: Deploy approved build to playcellbound.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ./
          local-dir: ./dist-site/
          log-level: standard
