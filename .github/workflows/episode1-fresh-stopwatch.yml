name: Episode 1 Fresh-Start Stopwatch
on:
  push:
    branches: [qa/episode1-timed-fresh-run-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-player-stopwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Timed fresh-account onboarding and early Episode 1 playthrough
        id: stopwatch
        continue-on-error: true
        run: node tools/episode1-stopwatch.cjs
      - name: Upload timed journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode1-fresh-stopwatch
          path: docs/qa/episode-one-timing/
          if-no-files-found: warn
      - name: Record test result
        if: always()
        run: echo "Stopwatch result: ${{ steps.stopwatch.outcome }}" >> "$GITHUB_STEP_SUMMARY"
