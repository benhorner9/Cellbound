name: Deploy Cellbound Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Fast checks and deploy to dev
    # Never publish when workflow_dispatch is run from any non-staging branch.
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Constrain ONLY the FTP deployment job. Independent browser QA must not
    # delay the next update, and an in-progress upload must never be cancelled.
    concurrency:
      group: cellbound-staging-ftps-v4
      cancel-in-progress: false

    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check staging commit is not superseded
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/staging | cut -f1)"
          test -n "$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Superseded by $latest. No dev deployment was attempted." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        if: steps.freshness.outputs.current == 'true'
        run: npm run build

      - name: Appearance foundation tests
        if: steps.freshness.outputs.current == 'true'
        run: npm run test:appearance

      - name: Core gameplay, PvP, loot, quest and editor regressions
        if: steps.freshness.outputs.current == 'true'
        run: npm run test:core

      - name: JavaScript syntax sweep
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file" >/dev/null
          done < <(find . -type f \( -name '*.js' -o -name '*.cjs' \) \
            -not -path './node_modules/*' -not -path './dist/*' -print)
          echo "JavaScript syntax sweep passed."

      - name: HTML and built-asset integrity
        if: steps.freshness.outputs.current == 'true'
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          let failed=false;
          const fail=m=>{console.error('ERROR:',m);failed=true};
          const warn=m=>console.warn('WARN:',m);

          for(const htmlName of ['index.html','guild.html']){
            const p=path.join('dist',htmlName);
            if(!fs.existsSync(p)){fail('Missing '+p);continue}
            const html=fs.readFileSync(p,'utf8');

            const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]);
            const seen=new Map();
            for(const id of ids) seen.set(id,(seen.get(id)||0)+1);
            for(const [id,count] of seen) if(count>1) fail(htmlName+' duplicate id "'+id+'" x'+count);

            const refs=[...html.matchAll(/\b(?:src|href)=["']([^"'#?]+)(?:[?#][^"']*)?["']/g)].map(m=>m[1]);
            for(const ref of refs){
              if(/^(?:https?:|mailto:|tel:|data:|javascript:)/i.test(ref)) continue;
              const clean=ref.replace(/^\.\//,'');
              const target=path.join('dist',clean);
              if(clean && !fs.existsSync(target)) fail(htmlName+' missing local reference '+ref);
            }
          }

          const guild=fs.readFileSync('dist/guild.html','utf8');
          const scripts=[...guild.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m=>m[1].split('?')[0]);
          const styles=[...guild.matchAll(/<link[^>]+rel=["']stylesheet["'][^>]+href=["']([^"']+)["']/g)].map(m=>m[1].split('?')[0]);
          for(const [kind,list] of [['script',scripts],['stylesheet',styles]]){
            const counts=new Map();
            list.forEach(x=>counts.set(x,(counts.get(x)||0)+1));
            for(const [ref,count] of counts) if(count>1) fail('guild.html duplicate '+kind+' '+ref+' x'+count);
          }

          const big=[];
          const walk=d=>{
            for(const e of fs.readdirSync(d,{withFileTypes:true})){
              const p=path.join(d,e.name);
              if(e.isDirectory()) walk(p);
              else {
                const size=fs.statSync(p).size;
                if(/\.(?:js|css)$/i.test(p)&&size>250000) big.push([p,size]);
              }
            }
          };
          walk('dist');
          big.sort((a,b)=>b[1]-a[1]);
          big.forEach(([p,s])=>warn('Large runtime asset '+p+' '+Math.round(s/1024)+' KB'));

          if(failed) process.exit(1);
          console.log('HTML and built-asset integrity passed.');
          NODE

      - name: QA inventory
        if: failure() && steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          echo "===== Largest JS/CSS ====="
          find dist -type f \( -name '*.js' -o -name '*.css' \) -printf '%s %p\n' | sort -nr | head -25
          echo "===== TODO/FIXME/HACK markers ====="
          grep -RniE 'TODO|FIXME|HACK|TEMPORARY' --include='*.js' --include='*.css' --include='*.html' . \
            --exclude-dir=node_modules --exclude-dir=dist | head -100 || true
          echo "===== Console warnings/errors in source ====="
          grep -RniE 'console\.(warn|error)\(' --include='*.js' . \
            --exclude-dir=node_modules --exclude-dir=dist | head -100 || true

      - name: Stamp deployment identity
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');fs.writeFileSync('dist/build-meta.json',JSON.stringify({commit:process.env.GITHUB_SHA,branch:'staging',deployedAt:new Date().toISOString()},null,2)+'\\n')"
          cat dist/build-meta.json

      - name: Verify deployment package
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/guild.html
          test -f dist/auth.js
          test -f dist/guild-v4.js
          test -f dist/build-meta.json
          test -f dist/item-atlas-v2.js
          test -f dist/item-visuals-v2.js
          for atlas in warrior paladin hunter rogue mage weapons secondary heads accessories resources; do test -f "dist/assets/items/illustrated-v2/$atlas.webp"; done
          test -f dist/combat-data-v1.js
          test -f dist/combat-reborn-v1.js
          test -f dist/combat-viewer-v1.js
          test -f dist/cellbound-ui-bundle-v1.css
          ! test -e dist/assets/characters/forge-bases/veyren-male.png
          ! test -e dist/assets/blackout-station/rooms/reactor-core.webp
          grep -F ':focus-visible' dist/cellbound-ui-bundle-v1.css
          grep -F 'CellboundCombatData' dist/combat-data-v1.js
          grep -F 'Cellbound combat data is unavailable' dist/combat-reborn-v1.js
          grep -F 'data-combat-view="canonical-v1"' dist/combat-viewer-v1.js
          grep -F "combat-viewer-v1.js?b=$GITHUB_SHA" dist/guild.html
          grep -F 'CANONICAL COMBAT VIEWER' dist/layout-safety-v1.css
          ! grep -F 'combat-3d-v1.js' dist/guild.html
          ! grep -F 'combat-3d-v1.css' dist/guild.html
          ! grep -R --line-number -E 'href="/|src="/' dist/*.html
          grep -F "$GITHUB_SHA" dist/build-meta.json
          echo "Verified deploy package for $GITHUB_SHA"

      - name: Verify staging-only deployment credentials
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          STAGING_FTP_SERVER: ${{ secrets.STAGING_FTP_SERVER }}
          STAGING_FTP_USERNAME: ${{ secrets.STAGING_FTP_USERNAME }}
          STAGING_FTP_PASSWORD: ${{ secrets.STAGING_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/staging'
          test -n "$STAGING_FTP_SERVER"
          test -n "$STAGING_FTP_USERNAME"
          test -n "$STAGING_FTP_PASSWORD"
          echo 'Approved staging credentials are configured; public-site credentials are not used.'

      - name: Reconfirm staging is current before FTP transfer
        if: steps.freshness.outputs.current == 'true'
        id: preupload
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/staging | cut -f1)"
          test -n "$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Another staging commit replaced this one before upload; skipping superseded deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy staging build
        if: steps.preupload.outputs.current == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.STAGING_FTP_PORT || 21 }}
          server-dir: ./cb/
          local-dir: ./dist/
          log-level: standard

      - name: Verify the exact deployed commit over HTTPS
        if: steps.preupload.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            echo "Smoke attempt $attempt/18"
            if curl --fail --silent --show-error --location --max-time 20 \
              "https://cb.athleticsmanagergame.com/build-meta.json?verify=$GITHUB_SHA" \
              --output /tmp/cellbound-build-meta.json; then
              if node -e "const m=require('/tmp/cellbound-build-meta.json'); if(m.commit!==process.env.GITHUB_SHA) process.exit(1)"; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" = "1"
          cat /tmp/cellbound-build-meta.json

          curl --fail --silent --show-error --location --max-time 20 \
            "https://cb.athleticsmanagergame.com/guild.html?verify=$GITHUB_SHA" \
            --output /tmp/cellbound-guild.html
          grep -F "combat-viewer-v1.js?b=$GITHUB_SHA" /tmp/cellbound-guild.html
          grep -F "analytics-v1.js?b=$GITHUB_SHA" /tmp/cellbound-guild.html

          curl --fail --silent --show-error --location --max-time 20 \
            "https://cb.athleticsmanagergame.com/combat-viewer-v1.js?verify=$GITHUB_SHA" \
            --output /tmp/cellbound-combat-viewer.js
          grep -F "data-combat-view" /tmp/cellbound-combat-viewer.js >/dev/null
          echo "HTTPS smoke test confirms staging commit $GITHUB_SHA"

      - name: Post-deploy canonical host diagnostics
        if: steps.preupload.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Build identity ====="
          curl --fail --silent --show-error --location \
            "https://cb.athleticsmanagergame.com/build-meta.json?diag=$GITHUB_SHA"
          echo
          echo "===== Root ====="
          curl --fail --silent --show-error --location --dump-header /tmp/root.headers \
            --output /tmp/root.html "https://cb.athleticsmanagergame.com/?diag=$GITHUB_SHA"
          sed -n '1,40p' /tmp/root.headers
          grep -Eio 'Guild Command|Return to your guild' /tmp/root.html | head -10
          echo "===== Guild ====="
          curl --fail --silent --show-error --location --dump-header /tmp/guild.headers \
            --output /tmp/guild.html "https://cb.athleticsmanagergame.com/guild.html?diag=$GITHUB_SHA"
          sed -n '1,40p' /tmp/guild.headers
          grep -F "combat-viewer-v1.js?b=$GITHUB_SHA" /tmp/guild.html
          echo "Post-deploy diagnostics passed for $GITHUB_SHA"
