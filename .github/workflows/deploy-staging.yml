name: Deploy Cellbound Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellbound-staging-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Deploy staging to cb.athleticsmanagergame.com
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Cellbound staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Cellbound
        run: npm run build

      - name: Verify deployment package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/guild.html
          test -f dist/auth.js
          test -f dist/guild-v4.js
          ! grep -F 'http-equiv="refresh" content="0;url=./index.html"' dist/guild.html
          ! grep -F 'window.location.replace("./index.html")' dist/guild.html
          test -f dist/assets/gear/cellbound-gear-atlas.webp
          ! grep -R --line-number -E 'href="/|src="/' dist/*.html

      - name: Deploy staging build
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.STAGING_FTP_PORT || 21 }}
          server-dir: ./cb/
          local-dir: ./dist/
          log-level: standard
