name: Validate Cellbound

on:
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellbound-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Cellbound build validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Cellbound
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and run regressions
        run: |
          npm run build
          npm run test:appearance

      - name: Core gameplay, PvP, loot, quest and editor regressions
        run: npm run test:core

      - name: Verify deployment package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/guild.html
          test -f dist/auth.js
          test -f dist/guild-v4.js
          test -f dist/combat-reborn-v1.js
          test -f dist/item-atlas-v2.js
          test -f dist/item-visuals-v2.js
          for atlas in warrior paladin hunter rogue mage weapons secondary heads accessories resources; do test -f "dist/assets/items/illustrated-v2/$atlas.webp"; done
          test -f dist/assets/combat/status-icons-v1.webp
          ! grep -R --line-number -E 'href="/|src="/' dist/*.html

      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium webkit

      - name: Chromium complete browser regressions
        id: chromium
        continue-on-error: true
        run: npm run test:browser

      - name: WebKit complete browser regressions (iPad Safari engine)
        id: webkit
        continue-on-error: true
        env:
          CELLBOUND_TEST_ENGINE: webkit
        run: npm run test:browser

      - name: Enforce both browser regression gates
        if: always() && (steps.chromium.outcome == 'failure' || steps.webkit.outcome == 'failure')
        run: |
          echo "Chromium or WebKit failed. See the complete test inventory in the job summary."
          exit 1

      - name: Save combat and playthrough captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellbound-release-review
          path: |
            /tmp/cellbound-living-combat.png
            /tmp/cellbound-equipment-fit-*.png
            /tmp/cellbound-race-identity-v2-*.png
            /tmp/cellbound-item-visuals-v2-*.png
            /tmp/cellbound-full-playthrough.png
            /tmp/cellbound-login-screen.png
            /tmp/cellbound-creator-*.png
          if-no-files-found: ignore
