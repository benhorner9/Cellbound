name: Validate Cellbound

on:
  pull_request:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellbound-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Cellbound build validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Cellbound
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and run regressions
        run: |
          npm run build
          npm run test:appearance

      - name: Verify deployment package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/guild.html
          test -f dist/auth.js
          test -f dist/guild-v4.js
          test -f dist/combat-reborn-v1.js
          test -f dist/item-atlas-v2.js
          test -f dist/item-visuals-v2.js
          for atlas in warrior paladin hunter rogue mage weapons secondary heads accessories resources; do test -f "dist/assets/items/illustrated-v2/$atlas.webp"; done
          test -f dist/assets/combat/status-icons-v1.webp
          ! grep -R --line-number -E 'href="/|src="/' dist/*.html

      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium webkit

      - name: Living combat browser regression
        run: |
          node tests/living-combat.browser.cjs
          CELLBOUND_TEST_ENGINE=webkit node tests/living-combat.browser.cjs

      - name: Equipment fit browser regression
        run: |
          node tests/equipment-fit.browser.cjs
          CELLBOUND_TEST_ENGINE=webkit node tests/equipment-fit.browser.cjs

      - name: Race identity browser regression
        run: |
          node tests/race-identity.browser.cjs
          CELLBOUND_TEST_ENGINE=webkit node tests/race-identity.browser.cjs

      - name: Item Visuals V2 browser regression
        run: |
          node tests/item-visuals-v2.browser.cjs
          CELLBOUND_TEST_ENGINE=webkit node tests/item-visuals-v2.browser.cjs

      - name: Manor owner QA gameplay regression
        run: |
          node tests/gameplay-regression.browser.cjs
          CELLBOUND_TEST_ENGINE=webkit node tests/gameplay-regression.browser.cjs

      - name: Full game browser playthrough
        run: |
          node tests/full-playthrough.browser.cjs
          CELLBOUND_TEST_ENGINE=webkit node tests/full-playthrough.browser.cjs

      - name: Login screen browser regression
        run: |
          node tests/login-screen.browser.cjs
          CELLBOUND_TEST_ENGINE=webkit node tests/login-screen.browser.cjs

      - name: Save combat and playthrough captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cellbound-release-review
          path: |
            /tmp/cellbound-living-combat.png
            /tmp/cellbound-equipment-fit-*.png
            /tmp/cellbound-race-identity-v2-*.png
            /tmp/cellbound-item-visuals-v2-*.png
            /tmp/cellbound-full-playthrough.png
            /tmp/cellbound-login-screen.png
            /tmp/cellbound-creator-*.png
          if-no-files-found: ignore
