name: Validate Cellbound

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellbound-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Production build validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Cellbound
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and run regressions
        run: npm run build

      - name: Verify deployment package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/guild.html
          test -f dist/auth.js
          test -f dist/guild-v4.js
          test -f dist/combat-reborn-v1.js
          test -f dist/assets/gear/cellbound-gear-atlas.webp
          test -f dist/assets/combat/status-icons-v1.webp
          ! grep -R --line-number -E 'href="/|src="/' dist/*.html

      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium webkit

      - name: Living world browser regression
        run: |
          node tests/living-world.browser.cjs
          CELLBOUND_TEST_ENGINE=webkit node tests/living-world.browser.cjs

      - name: Living combat browser regression
        run: |
          node tests/living-combat.browser.cjs
          CELLBOUND_TEST_ENGINE=webkit node tests/living-combat.browser.cjs

      - name: Save world review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-world-review
          path: /tmp/cellbound-world-*.png
          if-no-files-found: ignore

      - name: Save combat review capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-combat-review
          path: /tmp/cellbound-living-combat.png
          if-no-files-found: ignore
