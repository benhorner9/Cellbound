name: Deploy Oakrest development to shared hosting
on:
  push:
    branches: [deploy/oakrest-dev-20261020]
permissions:
  contents: read
concurrency:
  group: oakrest-dev-shared-host
  cancel-in-progress: false
env:
  OAKREST_COMMIT: 6bb8960c08b45fa2198b9ee6c0c5fecc39bee033
jobs:
  oakrest-development-only:
    name: QA and publish only /oakrest-dev/
    if: github.repository == 'benhorner9/Cellbound' && github.ref == 'refs/heads/deploy/oakrest-dev-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reviewed Oakrest development commit
        uses: actions/checkout@v4
        with:
          repository: benhorner9/Projectoakrest
          ref: ${{ env.OAKREST_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject a release that is not integrated into dev
        run: |
          test "$(git rev-parse HEAD)" = "$OAKREST_COMMIT"
          git fetch origin dev
          git merge-base --is-ancestor "$OAKREST_COMMIT" origin/dev
          test ! -f src/main.js
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Check source, rules and build
        run: |
          npm run check
          npm test
          npm run build
      - name: Stamp exact checked-out Classic development release
        run: node scripts/stamp-development-release.mjs
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Exercise normal built entry, creation, three styles and persistence
        run: timeout --signal=TERM --kill-after=10s 6m node tests/browser-classic-dev-launch.cjs
      - name: Exercise Classic gameplay, ownership, combat and adventure
        run: |
          node tests/browser-classic-save.cjs
          node tests/browser-classic-camera.cjs
          node tests/browser-classic-equipment-ui.cjs
          node tests/browser-classic-free-combat.cjs
          node tests/browser-classic-combat-overhaul.cjs
          node tests/browser-classic-combat-impacts.cjs
          timeout --signal=TERM --kill-after=10s 4m node tests/browser-classic-combat-engagement.cjs
          timeout --signal=TERM --kill-after=10s 4m node tests/browser-classic-abilities.cjs
          timeout --signal=TERM --kill-after=10s 6m node tests/browser-adventure-complete.cjs
          timeout --signal=TERM --kill-after=10s 6m node tests/browser-adventure.cjs
      - name: Snapshot public release before development upload
        run: python3 scripts/public-snapshot.py qa/public-before.json
      - name: Check existing secure hosting connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
      - name: Upload only the isolated development directory
        id: upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ./oakrest-dev/
          state-name: .ftp-deploy-oakrest-dev-state.json
          dangerous-clean-slate: false
          log-level: standard
      - name: Verify pinned hosted commit and every development asset
        run: |
          for attempt in 1 2 3 4; do
            if node scripts/verify-hosted.mjs; then exit 0; fi
            echo "Hosted integrity has not converged (attempt $attempt)"
            sleep 15
          done
          exit 1
      - name: Verify hosted normal Classic entry, gameplay and save reload
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        env:
          OAKREST_TEST_URL: https://playcellbound.com/oakrest-dev/
        run: timeout --signal=TERM --kill-after=10s 6m node tests/browser-classic-dev-launch.cjs
      - name: Verify hosted First Adventure with a new isolated character
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        env:
          OAKREST_CLASSIC_URL: https://playcellbound.com/oakrest-dev/classic.html
        run: timeout --signal=TERM --kill-after=10s 6m node tests/browser-adventure.cjs
      - name: Verify hosted equipment and eight character quick slots
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        env:
          OAKREST_CLASSIC_URL: https://playcellbound.com/oakrest-dev/classic.html
        run: timeout --signal=TERM --kill-after=10s 6m node tests/browser-classic-equipment-ui.cjs
      - name: Confirm public site unchanged even after a partial upload
        if: ${{ !cancelled() && steps.upload.outcome != 'skipped' }}
        run: python3 scripts/public-snapshot.py qa/public-before.json --compare
      - name: Preserve tested build and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-development-release
          include-hidden-files: true
          path: |
            dist/
            qa/
