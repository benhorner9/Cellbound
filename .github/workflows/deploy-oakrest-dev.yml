name: Deploy Oakrest development to shared hosting
on:
  push:
    branches: [deploy/oakrest-dev-20261020]
permissions:
  contents: read
concurrency:
  group: oakrest-dev-shared-host
  cancel-in-progress: false
env:
  OAKREST_COMMIT: 1f7a27bb4da9a8aff44687fdb5e0bbae80ca8d27
jobs:
  host-isolation-diagnostic:
    name: Read-only Oakrest public/dev routing fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect HTTP routing and content without uploads
        run: |
          python3 - <<'PY'
          import hashlib,urllib.request,urllib.error,time,json
          for section in ('oakrest','oakrest-dev'):
            for path in ('build-meta.json','index.html','src/main.js','assets/kaykit-adventurers/arrow.gltf'):
              url='https://playcellbound.com/'+section+'/'+path+'?oakrest_diagnostic='+str(int(time.time()))
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'Oakrest-ReadOnly-Diagnostic/1'})
              try:
                with urllib.request.urlopen(req,timeout=20) as res:
                  data=res.read()
                  print(json.dumps({'section':section,'path':path,'url':res.url.split('?')[0],
                    'status':res.status,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),
                    'content_type':res.headers.get('Content-Type'),'sample':data[:110].decode('utf-8','replace') if path.endswith('.json') else None}))
              except urllib.error.HTTPError as err:
                print(json.dumps({'section':section,'path':path,'status':err.code,'reason':str(err.reason)}))
          PY
  host-readonly-browser-diagnostic:
    name: Read-only remote browser and byte-integrity diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout combined Oakrest source (READ ONLY for hosting)
        uses: actions/checkout@v4
        with:
          repository: benhorner9/Projectoakrest
          ref: 1f7a27bb4da9a8aff44687fdb5e0bbae80ca8d27
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare tested local build
        run: |
          npm ci --ignore-scripts
          npm run build
          npx playwright install chromium
      - name: Compare actual hosted bytes and report browser errors
        run: |
          node <<'NODE'
          const {chromium}=require('playwright'),{readFileSync}=require('node:fs'),{createHash}=require('node:crypto');
          const hash=v=>createHash('sha256').update(v).digest('hex');
          (async()=>{
            const base='https://playcellbound.com/oakrest-dev/';
            for(const path of ['index.html','src/main.js','assets/kaykit-adventurers/arrow.gltf','assets/kaykit-adventurers/sword_1handed.gltf','build-meta.json']){
              const res=await fetch(base+path+'?oakrest_integrity='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
              const bytes=Buffer.from(await res.arrayBuffer());
              const expected=path==='build-meta.json'?null:readFileSync('dist/'+path);
              console.log('HOSTED INTEGRITY',JSON.stringify({path,status:res.status,bytes:bytes.length,sha:hash(bytes),
                expectedBytes:expected?.length,expectedSha:expected?hash(expected):null,match:expected?hash(bytes)===hash(expected):null,contentType:res.headers.get('content-type'),
                sample:path==='build-meta.json'?bytes.toString('utf8').slice(0,300):null}));
            }
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try{
              const ctx=await browser.newContext({viewport:{width:1366,height:1024},hasTouch:true});
              const page=await ctx.newPage();
              page.on('console',msg=>{if(msg.type()==='error')console.log('BROWSER CONSOLE ERROR',msg.text().slice(0,500));});
              page.on('pageerror',err=>console.log('BROWSER PAGE ERROR',err.stack?.slice(0,1000)||String(err)));
              page.on('requestfailed',request=>console.log('BROWSER REQUEST FAILURE',request.url(),request.failure()?.errorText));
              page.on('response',res=>{if(res.status()>=400)console.log('BROWSER HTTP',res.status(),res.url());});
              await page.goto(base+'?qa=1&diagnostic='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(8000);
              console.log('BROWSER RESULT',JSON.stringify(await page.evaluate(()=>({
               page:location.pathname,qa:typeof window.oakrestQA,error:document.getElementById('error')?.textContent?.slice(0,400),
               game:!!document.querySelector('#game canvas'),intro:!!document.getElementById('begin')}))));
              await ctx.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error('READ ONLY DIAGNOSTIC FAILED',e.stack||String(e));process.exitCode=1});
          NODE
      - name: Run restored hosted gameplay regression without uploading anything
        env:
          OAKREST_TEST_URL: https://playcellbound.com/oakrest-dev/
        run: node tests/browser-release.cjs
  oakrest-development-only:
    name: QA and publish only /oakrest-dev/
    if: github.repository == 'benhorner9/Cellbound' && github.ref == 'refs/heads/deploy/oakrest-dev-20261020'
    runs-on: ubuntu-latest
    # Browser provisioning and separate hosted smoke passes can exceed 20 minutes.
    timeout-minutes: 35
    steps:
      - name: Check out reviewed Oakrest development commit
        uses: actions/checkout@v4
        with:
          repository: benhorner9/Projectoakrest
          ref: ${{ env.OAKREST_COMMIT }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Check source, rules and build
        run: |
          npm run check
          npm test
          npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Exercise built development release
        run: node tests/browser-release.cjs
      - name: Gate release on the actual Universal, civilian, village and Ultimate Monsters visuals
        run: timeout --signal=TERM --kill-after=10s 3m node tests/browser-quaternius.cjs
      - name: Stamp reviewed development release
        run: |
          node --input-type=module - <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('dist/build-meta.json',JSON.stringify({project:'oakrest',environment:'development',branch:'dev',commit:process.env.OAKREST_COMMIT,deployedAt:new Date().toISOString()},null,2)+'\n');
          NODE
          test -f dist/src/equipment-ui.js
          test -f dist/src/storage-key.js
          test -f dist/src/minimap.js
          test -f dist/src/hud-minimap.css
          grep -q 'id="minimap-button"' dist/index.html
          test -f dist/.htaccess
          ! test -f dist/guild.html
      - name: Snapshot public release before development upload
        run: python3 scripts/public-snapshot.py qa/public-before.json
      - name: Check existing secure hosting connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
      - name: Upload only the isolated development directory
        id: upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ./oakrest-dev/
          state-name: .ftp-deploy-oakrest-dev-state.json
          dangerous-clean-slate: false
          log-level: standard
      - name: Verify every hosted development file (retry transient cache propagation)
        run: |
          for attempt in 1 2 3 4; do
            if node scripts/verify-hosted.mjs; then exit 0; fi
            echo "Hosted integrity has not converged (attempt $attempt)"
            sleep 15
          done
          exit 1
      - name: Hosted development gameplay and persistence
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        env:
          OAKREST_TEST_URL: https://playcellbound.com/oakrest-dev/
        run: node tests/browser-release.cjs
      - name: Hosted melee, ranged and magic contact verification
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        run: |
          node --input-type=commonjs - <<'NODE'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            try{
              const {defaultSave}=await import('./src/rules.js');
              const context=await browser.newContext({viewport:{width:1366,height:1024},hasTouch:true});
              await context.addInitScript(d=>localStorage.setItem('oakrest-dev-v1',JSON.stringify(d)),defaultSave());
              const page=await context.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('https://playcellbound.com/oakrest-dev/?qa=1');
              await page.waitForFunction(()=>window.oakrestQA);await page.locator('#begin').click();
              for(const style of ['melee','ranged','magic']){
                const result=await page.evaluate(style=>{
                  oakrestQA.step(3);oakrestQA.style(style);oakrestQA.teleport(-6,-1);oakrestQA.aim(-6,1.25,-3);oakrestQA.step(1);
                  const before=oakrestQA.state().enemies[0].hp;
                  if(!oakrestQA.state().autoCombat&&!oakrestQA.target('dummy'))throw Error('Cannot lock practice dummy');
                  oakrestQA.step(8);
                  return {style,before,after:oakrestQA.state().enemies[0].hp,autoCombat:oakrestQA.state().autoCombat,version:oakrestDiagnostics().version};
                },style);
                assert.ok(result.after<result.before,JSON.stringify(result));assert.equal(result.autoCombat,true);assert.equal(result.version,'auto-combat-1');console.log('HOSTED COMBAT PASS',JSON.stringify(result));
              }
              await page.screenshot({path:'qa/hosted-combat-reborn.png'});assert.deepEqual(errors,[]);
              await context.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Confirm public site unchanged
        if: ${{ !cancelled() && steps.upload.outcome != 'skipped' }}
        run: python3 scripts/public-snapshot.py qa/public-before.json --compare
      - name: Preserve tested build and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oakrest-development-release
          include-hidden-files: true
          path: |
            dist/
            qa/*.png
            qa/*.json
            qa/*.log
