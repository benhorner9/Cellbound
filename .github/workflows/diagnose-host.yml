name: Diagnose Live Host

on:
  push:
    branches:
      - host-diagnostics

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare staging and production
        shell: bash
        run: |
          set -euo pipefail
          for url in "https://cb.athleticsmanagergame.com/" "https://playcellbound.com/"; do
            echo "URL: $url"
            curl -k -sS -o /tmp/body -D /tmp/headers --max-time 20 "$url" || true
            sed -n '1,12p' /tmp/headers
            echo "TITLE:"
            grep -io '<title>[^<]*' /tmp/body | head -1 || true
            echo "COMING_SOON_MARKER:"
            grep -io 'Coming Soon' /tmp/body | head -1 || true
            echo "LOGIN_MARKER:"
            grep -io 'Return to your guild' /tmp/body | head -1 || true
            echo
          done
