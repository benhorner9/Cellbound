name: Diagnose Live Host

on:
  push:
    branches:
      - host-diagnostics

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public domain routing
        shell: bash
        run: |
          set -u
          echo "DNS: playcellbound.com"
          getent ahostsv4 playcellbound.com || true
          echo
          echo "DNS: www.playcellbound.com"
          getent ahostsv4 www.playcellbound.com || true
          echo
          echo "DNS: ftp.webkraftstudios.com"
          getent ahostsv4 ftp.webkraftstudios.com || true
          echo
          echo "HTTPS HEAD: playcellbound.com"
          curl -k -sS -I --max-time 15 https://playcellbound.com/ || true
          echo
          echo "HTTP HEAD: playcellbound.com"
          curl -sS -I --max-time 15 http://playcellbound.com/ || true
          echo
          echo "HTTPS HEAD: www.playcellbound.com"
          curl -k -sS -I --max-time 15 https://www.playcellbound.com/ || true
