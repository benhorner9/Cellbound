name: Diagnose Live Host

on:
  push:
    branches:
      - host-diagnostics

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect FTP layout
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT:-21}"
          echo "ROOT"
          curl --insecure --silent --show-error --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER:$PORT/" --list-only | sed -n '1,120p'
          echo
          echo "CB"
          curl --insecure --silent --show-error --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER:$PORT/cb/" --list-only | sed -n '1,120p' || true
