name: Diagnose Live Host

on:
  push:
    branches:
      - host-diagnostics

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live site
        shell: bash
        run: |
          set -euo pipefail
          for url in             "https://playcellbound.com/"             "https://playcellbound.com/index.html"             "https://www.playcellbound.com/"; do
            echo "URL: $url"
            curl -k -sS -D - -o /tmp/body --max-time 20 "$url" | sed -n '1,12p'
            echo "BODY:"
            sed -n '1,8p' /tmp/body
            echo
          done
