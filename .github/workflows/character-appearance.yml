name: Character appearance and universal fitting
on:
  push:
    branches: [character-appearance-overhaul]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:core
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: cellbound-${{ runner.os }}-playwright-1.51.1-${{ matrix.engine }}
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: All equipment and creation fits
        env:
          CELLBOUND_TEST_ENGINE: ${{ matrix.engine }}
        run: |
          node tests/equipment-fit.browser.cjs
          node tests/race-identity.browser.cjs
          node tests/character-appearance-overhaul.browser.cjs
          node tests/item-visuals-v2.browser.cjs
          node tests/weapon-attachments.browser.cjs
      - name: Every skill and actual class encounters
        env:
          CELLBOUND_TEST_ENGINE: ${{ matrix.engine }}
        run: |
          node tests/combat-class-animation.browser.cjs
          node tests/combat-class-encounters.browser.cjs
          node tests/combat-cinematic-global.browser.cjs
          node tests/onboarding-beta.browser.cjs
          node tests/pvp-practice-window.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-appearance-${{ matrix.engine }}
          path: |
            /tmp/cellbound-appearance
            /tmp/cellbound-equipment-fit*.png
            /tmp/cellbound-race-identity*.png
            /tmp/cellbound-item-visuals*.png
            /tmp/cellbound-class-animation
            /tmp/cellbound-cinematic*
          if-no-files-found: ignore
