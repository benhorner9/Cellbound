name: Oakrest Bank Drag Read-only QA
on:
  push:
    branches:
      - diagnostic/oakrest-bank-drag
permissions:
  contents: read
jobs:
  bank:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          repository: benhorner9/Projectoakrest
          ref: 92549e5398aa1b4a027554991d74b019505cd17b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/grand-bank-and-drag.test.js tests/town-services.test.js tests/town-placement.test.js
      - run: npx playwright install --with-deps chromium
      - name: Bank drag + persistence in Chromium
        run: node tests/browser-town.cjs
